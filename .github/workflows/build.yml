name: Build Cross-Platform Installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact_name: windows-installer
            files: release/VideoDurationCalculator-Setup.exe
          - os: ubuntu-latest
            script: dist:linux
            artifact_name: ubuntu-installers
            files: |
              release/VideoDurationCalculator.deb
              release/VideoDurationCalculator.AppImage

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (OS-specific FFprobe)
        run: npm install --no-audit --no-fund

      - name: Build production installer
        run: npm run ${{ matrix.script }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.files }}
